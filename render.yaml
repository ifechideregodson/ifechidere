services:
  - type: web
    name: ditrine-api
    runtime: node
    plan: free
    rootDir: services/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: ditrine
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_ROLE_CLAIM
        value: https://ditrine.com/role
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_SIGNING_SECRET
        sync: false
      - key: COINBASE_API_KEY_NAME
        sync: false
      - key: COINBASE_API_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: ditrine-pulse
    runtime: node
    plan: free
    rootDir: apps/pulse
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ditrine-api
          property: host
      - key: NEXT_PUBLIC_MARKET_URL
        fromService:
          type: web
          name: ditrine-market
          property: host
      - key: NEXT_PUBLIC_SUPPLY_URL
        fromService:
          type: web
          name: ditrine-supply
          property: host
      - key: NEXT_PUBLIC_STREAM_URL
        fromService:
          type: web
          name: ditrine-stream
          property: host
      - key: NEXT_PUBLIC_CONTROL_URL
        fromService:
          type: web
          name: ditrine-control
          property: host

