services:
  - type: web
    name: ditrine-api
    runtime: node
    rootDir: services/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: ditrine-pulse
    runtime: node
    rootDir: apps/pulse
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ditrine-api
          property: host
      - key: NEXT_PUBLIC_MARKET_URL
        sync: false
      - key: NEXT_PUBLIC_SUPPLY_URL
        sync: false
      - key: NEXT_PUBLIC_STREAM_URL
        sync: false
      - key: NEXT_PUBLIC_CONTROL_URL
        sync: false

